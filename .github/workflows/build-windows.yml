name: Build WSA PacMan for Windows

on:
  push:
    branches:
      - custom/white-ui
      - wsa/auto-architecture-runtime
      - wsa/auto-prerequisite-repair
      - wsa/virtualization-diagnostics
      - wsa/automatic-runtime-resume
      - wsa/background-tray-silent-installs
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter 3.3.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.9'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate runtime, tray behavior and installer automation
        shell: pwsh
        run: |
          $scriptText = Get-Content "wsa-runtime/Install-WSA.ps1" -Raw
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($scriptText, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "WSA runtime setup script contains PowerShell syntax errors"
          }

          $definedFunctions = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true) | ForEach-Object { $_.Name })
          foreach ($functionName in @(
            "Get-WindowsTarget", "Get-ExistingWsaPackage", "Confirm-WsaPrerequisites",
            "Register-WsaResumeTask", "Remove-WsaResumeTask", "Get-LatestMatchingWsaAsset",
            "Install-WsaFromFolder"
          )) {
            if ($definedFunctions -notcontains $functionName) {
              throw "Required runtime function is not defined: $functionName"
            }
          }

          foreach ($check in @(
            "VirtualizationFirmwareEnabled", "VMMonitorModeExtensions",
            "SecondLevelAddressTranslationExtensions", "HypervisorPresent",
            "Windows 11 26H2", "Task Manager > Performance > CPU",
            "Register-ScheduledTask", "ResumeAfterRestart", "Automatic continuation",
            " < nul", "VirtualMachinePlatform", "HypervisorPlatform",
            "Get-WindowsOptionalFeature", "Enable-WindowsOptionalFeature",
            "Get-FileHash"
          )) {
            if ($scriptText -notmatch [regex]::Escape($check)) {
              throw "Required runtime check is missing: $check"
            }
          }

          foreach ($obsolete in @(
            "Download, verify, extract and install this matching WSA package now",
            "Press Enter to close",
            "Then open Start > WSA PacMan"
          )) {
            if ($scriptText -match [regex]::Escape($obsolete)) {
              throw "Obsolete interactive runtime behavior is still present: $obsolete"
            }
          }

          $windowHeader = Get-Content "windows/runner/win32_window.h" -Raw
          $windowSource = Get-Content "windows/runner/win32_window.cpp" -Raw
          $mainSource = Get-Content "windows/runner/main.cpp" -Raw
          foreach ($check in @(
            "ExitApplication", "NIM_ADD", "NIM_DELETE", "kTrayCallbackMessage",
            "kTrayExitCommand", "WM_CLOSE", "SW_HIDE", "SetQuitOnClose(false)"
          )) {
            if (($windowHeader + $windowSource + $mainSource) -notmatch [regex]::Escape($check)) {
              throw "Notification-area behavior is missing: $check"
            }
          }

          $installerText = Get-Content "installer/installer.iss" -Raw
          if ($installerText -notmatch '^Name: install_wsa_runtime;') {
            throw "The matching WSA runtime installer task is missing"
          }

      - name: Build Windows application
        run: flutter build windows --release

      - name: Verify bundled runtime files and prepare portable package
        shell: pwsh
        run: |
          $requiredFiles = @(
            "build/windows/runner/Release/WSA-pacman.exe",
            "build/windows/runner/Release/flutter_windows.dll",
            "embedded-tools/adb.exe",
            "embedded-tools/AdbWinApi.dll",
            "embedded-tools/AdbWinUsbApi.dll",
            "embedded-tools/aapt.exe",
            "embedded-tools/aapt2.exe",
            "embedded-tools/axmldec.exe",
            "installer/redist/VC_redist.x64.exe",
            "wsa-runtime/Install-WSA.ps1"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) { throw "Required bundled runtime file is missing: $file" }
          }

          New-Item -ItemType Directory -Force -Path "build/installer" | Out-Null
          Copy-Item -Path "embedded-tools" -Destination "build/windows/runner/Release/embedded-tools" -Recurse -Force
          Copy-Item -Path "wsa-runtime" -Destination "build/windows/runner/Release/wsa-runtime" -Recurse -Force
          Compress-Archive -Path "build/windows/runner/Release/*" -DestinationPath "build/installer/WSA-PacMan-portable-universal.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build silent Windows installer
        shell: pwsh
        working-directory: installer
        run: |
          # Keep the checked-in installer readable, but enforce unattended runtime
          # execution in the release artifact. The task remains selected by default.
          $iss = Get-Content "installer.iss" -Raw
          $iss = $iss -replace 'Parameters: "-NoProfile -ExecutionPolicy Bypass -File', 'Parameters: "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File'
          $iss = $iss -replace 'Flags: postinstall waituntilterminated skipifsilent; Tasks: install_wsa_runtime', 'Flags: waituntilterminated runhidden; Tasks: install_wsa_runtime'
          Set-Content "installer.generated.iss" -Value $iss -Encoding UTF8

          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found at $compiler" }
          & $compiler "installer.generated.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $builtInstaller = "build/installer/WSA-pacman-universal-v1.5.0-installer.exe"
          if (-not (Test-Path $builtInstaller)) { throw "Silent Windows installer was not produced" }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: wsa-pacman-windows-universal-${{ github.sha }}
          path: |
            build/installer/WSA-PacMan-portable-universal.zip
            build/installer/WSA-pacman-universal-v1.5.0-installer.exe
          if-no-files-found: error
          retention-days: 14
