name: Build WSA PacMan for Windows

on:
  push:
    branches:
      - custom/white-ui
      - wsa/auto-architecture-runtime
      - wsa/auto-prerequisite-repair
      - wsa/virtualization-diagnostics
      - wsa/automatic-runtime-resume
      - wsa/tray-background-silent-install
      - wsa/stop-bundled-adb-before-upgrade
      - wsa/minimize-android-workspace-with-pacman
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter 3.3.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.9'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate WSA runtime checks and installer defaults
        shell: pwsh
        run: |
          $scriptText = Get-Content "wsa-runtime/Install-WSA.ps1" -Raw
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput(
            $scriptText, [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "WSA runtime setup script contains PowerShell syntax errors"
          }

          # Catch missing function definitions as well as parser-level syntax errors.
          $definedFunctions = @(
            $ast.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst]
            }, $true) | ForEach-Object { $_.Name }
          )
          $requiredFunctions = @(
            "Get-WindowsTarget",
            "Get-ExistingWsaPackage",
            "Confirm-WsaPrerequisites",
            "Register-WsaResumeTask",
            "Remove-WsaResumeTask",
            "Get-LatestMatchingWsaAsset",
            "Install-WsaFromFolder"
          )
          foreach ($functionName in $requiredFunctions) {
            if ($definedFunctions -notcontains $functionName) {
              throw "Required runtime function is not defined: $functionName"
            }
          }

          $requiredChecks = @(
            "Get-NativeArchitecture",
            "VirtualizationFirmwareEnabled",
            "VMMonitorModeExtensions",
            "SecondLevelAddressTranslationExtensions",
            "HypervisorPresent",
            "Windows 11 26H2",
            "Task Manager > Performance > CPU",
            "New-ScheduledTaskTrigger",
            "New-ScheduledTaskPrincipal",
            "Register-ScheduledTask",
            "-Verb RunAs -WindowStyle Hidden -Wait -PassThru",
            "ResumeAfterRestart",
            "Automatic continuation",
            "Install-WSA-PacMan-Unattended.ps1",
            "RedirectStandardOutput",
            "RedirectStandardError",
            "System.Text.RegularExpressions.MatchEvaluator",
            "RawUI",
            "PacMan will not uninstall or replace it",
            "VirtualMachinePlatform",
            "HypervisorPlatform",
            "Get-WindowsOptionalFeature",
            "Enable-WindowsOptionalFeature",
            "TotalPhysicalMemory",
            "DriveFormat",
            "AvailableFreeSpace",
            "Get-FileHash"
          )
          foreach ($check in $requiredChecks) {
            if ($scriptText -notmatch [regex]::Escape($check)) {
              throw "Required WSA prerequisite/security check is missing: $check"
            }
          }

          if ($scriptText -match "Download, verify, extract and install this matching WSA package now") {
            throw "The runtime installer must not add a redundant confirmation after its installer task has been selected"
          }
          if ($scriptText -match "Press Enter to close") {
            throw "The runtime helper must not block automatic continuation with a console pause"
          }
          if ($scriptText -match "Then open Start > WSA PacMan") {
            throw "The runtime helper must resume automatically after the prerequisite restart"
          }
          if ($scriptText -match "Read-Host") {
            throw "The runtime helper must not require an interactive PowerShell console"
          }
          if ($scriptText -notmatch "-WindowStyle Hidden") {
            throw "The runtime helper and its elevation/resume processes must be hidden"
          }
          if ($scriptText.Contains('Start-Process -FilePath $env:ComSpec')) {
            throw "WSA setup must not launch Run.bat because it spawns a visible PowerShell window"
          }
          if (-not $scriptText.Contains('Join-Path $workingDirectory ''Install.ps1''')) {
            throw "WSA setup must invoke the upstream Install.ps1 directly"
          }
          $unattendedChecks = @(
            "Install-WSA-PacMan-Unattended.ps1",
            "RedirectStandardOutput",
            "RedirectStandardError",
            "System.Text.RegularExpressions.MatchEvaluator",
            "RawUI\.ReadKey",
            "preservePattern",
            "PacMan will not uninstall or replace it"
          )
          foreach ($check in $unattendedChecks) {
            if (-not $scriptText.Contains($check)) {
              throw "Required hidden-install safety behavior is missing: $check"
            }
          }

          $stopAdbScript = Get-Content "installer/Stop-WSA-Adb.ps1" -Raw
          $stopAdbTokens = $null
          $stopAdbParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseInput(
            $stopAdbScript, [ref]$stopAdbTokens, [ref]$stopAdbParseErrors
          ) | Out-Null
          if ($stopAdbParseErrors.Count -gt 0) {
            $stopAdbParseErrors | ForEach-Object { Write-Error $_.Message }
            throw "Installer ADB shutdown script contains PowerShell syntax errors"
          }
          foreach ($check in @(
            "Get-CimInstance -ClassName Win32_Process",
            "ExecutablePath",
            "OrdinalIgnoreCase",
            "kill-server",
            "AddSeconds(10)",
            "Get-MatchingPacmanProcesses",
            "AddSeconds(15)",
            "WSA-pacman.exe",
            "Right-click its notification-area icon"
          )) {
            if ($stopAdbScript -notmatch [regex]::Escape($check)) {
              throw "Required safe ADB shutdown behavior is missing: $check"
            }
          }

          $installerText = Get-Content "installer/installer.iss" -Raw
          $requiredUninstallSettings = @(
            "Uninstallable=yes",
            "CreateUninstallRegKey=yes",
            "UninstallDisplayName=WSA PacMan",
            'Name: "{group}\\Uninstall WSA PacMan"; Filename: "{uninstallexe}"',
            'Type: filesandordirs; Name: "{app}\\*"',
            'Type: filesandordirs; Name: "{userprofile}\\.wsa-pacman"',
            'Type: filesandordirs; Name: "{userprofile}\\.wsamanager"'
          )
          foreach ($check in $requiredUninstallSettings) {
            if (-not $installerText.Contains($check)) {
              throw "Required WSA PacMan uninstall behavior is missing: $check"
            }
          }
          $uninstallCleanupEntries = @($installerText -split "`n" | Where-Object { $_ -match "^Type: filesandordirs;" })
          if ($uninstallCleanupEntries.Count -lt 3) {
            throw "The installer must clean the app directory and both PacMan settings directories"
          }
          if (($uninstallCleanupEntries -join "`n").Contains("WSABuilds") -or
              ($uninstallCleanupEntries -join "`n").Contains("ProgramData")) {
            throw "Uninstall must not delete the separately installed WSA runtime under ProgramData"
          }
          if ($installerText -notmatch "Flags: runhidden waituntilterminated; Tasks: install_wsa_runtime") {
            throw "The Android runtime helper must run hidden and finish before installer completion"
          }
          if ($installerText -match "skipifsilent") {
            throw "Silent Inno Setup installs must still run the selected Android runtime task"
          }
          if ($installerText -notmatch "CloseApplications=yes" -or
              $installerText -notmatch "RestartApplications=no" -or
              $installerText -notmatch "function PrepareToInstall" -or
              $installerText -notmatch "Stop-WSA-Adb.ps1" -or
              $installerText -notmatch "RegisterWindowMessage" -or
              $installerText -notmatch "PostBroadcastMessage") {
            throw "Installer must stop the bundled ADB server before the Restart Manager file-in-use check"
          }

          $traySource = Get-Content "windows/runner/win32_window.cpp" -Raw
          $trayHeader = Get-Content "windows/runner/win32_window.h" -Raw
          $trayMain = Get-Content "windows/runner/main.cpp" -Raw
          $trayCmake = Get-Content "windows/runner/CMakeLists.txt" -Raw
          $trayChecks = @(
            "WSA.PacMan.PrepareForUpgrade.1",
            "ExitApplication",
            "Shell_NotifyIconW",
            "QueryFullProcessImageNameW",
            "GetWindowThreadProcessId",
            "EnumWindows",
            "WsaClient.exe",
            "WsaService",
            "HideWsaAppWindows",
            "RestoreWsaAppWindows",
            "SetWindowPlacement",
            "ShowWindow(window, SW_HIDE)",
            "NIM_ADD",
            "NIM_DELETE",
            "TaskbarCreated",
            "WM_CLOSE",
            "SC_CLOSE",
            "SIZE_MINIMIZED",
            "Exit WSA PacMan",
            "Show Android workspace",
            "IsIconic(window_handle_)",
            "IsIconic(hwnd)",
            "tray_icon_added_ ? SW_HIDE : SW_MINIMIZE",
            "notification-area icon could not be restored"
          )
          foreach ($check in $trayChecks) {
            if ($traySource -notmatch [regex]::Escape($check)) {
              throw "Required native tray behavior is missing: $check"
            }
          }
          if (-not $trayHeader.Contains("SetCloseToTray") -or
              -not $trayMain.Contains("SetCloseToTray(is_main_manager_window)") -or
              -not $trayMain.Contains("command_line_arguments.empty()") -or
              -not $trayCmake.Contains("shell32") -or
              -not $trayCmake.Contains("advapi32") -or
              $traySource.Contains("SetWinEventHook") -or
              $trayHeader.Contains("WsaWindowEventCallback")) {
            throw "The WSA PacMan main window is not fully configured for notification-area support"
          }

          $wsaUtilsText = Get-Content "lib/utils/wsa_utils.dart" -Raw
          if ($wsaUtilsText -notmatch "appWindow.hide\(\)") {
            throw "Launching an Android app from PacMan must hide only the manager so the newly launched app stays visible"
          }

          $installerText = Get-Content "installer/installer.iss" -Raw
          $runtimeTask = $installerText -split "\r?\n" |
            Where-Object { $_ -match '^Name: install_wsa_runtime;' } |
            Select-Object -First 1
          if (-not $runtimeTask) {
            throw "The optional matching-WSA runtime installer task is missing"
          }
          if ($runtimeTask -match 'Flags:\s*unchecked') {
            throw "The matching-WSA runtime installer task must be selected by default"
          }

      - name: Build Windows application
        run: flutter build windows --release

      - name: Verify bundled runtime files and prepare portable package
        shell: pwsh
        run: |
          $requiredFiles = @(
            "build/windows/runner/Release/WSA-pacman.exe",
            "build/windows/runner/Release/flutter_windows.dll",
            "embedded-tools/adb.exe",
            "embedded-tools/AdbWinApi.dll",
            "embedded-tools/AdbWinUsbApi.dll",
            "embedded-tools/aapt.exe",
            "embedded-tools/aapt2.exe",
            "embedded-tools/axmldec.exe",
            "installer/redist/VC_redist.x64.exe",
            "installer/Stop-WSA-Adb.ps1",
            "wsa-runtime/Install-WSA.ps1"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required bundled runtime file is missing: $file"
            }
          }

          New-Item -ItemType Directory -Force -Path "build/installer" | Out-Null
          Copy-Item -Path "embedded-tools" -Destination "build/windows/runner/Release/embedded-tools" -Recurse -Force
          Copy-Item -Path "wsa-runtime" -Destination "build/windows/runner/Release/wsa-runtime" -Recurse -Force

          if (-not (Test-Path "build/windows/runner/Release/wsa-runtime/Install-WSA.ps1")) {
            throw "WSA runtime installer was not copied into the release package"
          }

          $packagedTools = @("adb.exe", "AdbWinApi.dll", "AdbWinUsbApi.dll", "aapt.exe", "aapt2.exe", "axmldec.exe")
          foreach ($tool in $packagedTools) {
            if (-not (Test-Path "build/windows/runner/Release/embedded-tools/$tool")) {
              throw "Bundled helper tool was not copied into the release package: $tool"
            }
          }

          Compress-Archive -Path "build/windows/runner/Release/*" -DestinationPath "build/installer/WSA-PacMan-portable-universal.zip" -Force
          if (-not (Test-Path "build/installer/WSA-PacMan-portable-universal.zip")) {
            throw "Portable package was not created"
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        working-directory: installer
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler not found at $compiler"
          }
          # The actual ISCC compile below validates x64compatible support. ISCC.exe
          # may report ProductVersion=0.0.0 despite a newer Inno Setup installation.
          & $compiler "installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: wsa-pacman-windows-universal-${{ github.sha }}
          path: |
            build/installer/WSA-PacMan-portable-universal.zip
            build/installer/WSA-pacman-universal-v1.5.0-installer.exe
          if-no-files-found: error
          retention-days: 14
